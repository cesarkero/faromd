<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Reparto semanal del estudio</title>
  <desc id="desc">Semana base de veinte Pomodoros: nueve para Atención Primaria, cinco para repasos, dos para urgencias, dos para cursos, uno para artículos y uno para preguntas MIR.</desc>
  <defs>
    <style>
      .bg{fill:#f7f1e7}.ink{fill:#1d1b19}.muted{fill:#665f57}.white{fill:#fffdf9}
      .ap{fill:#5b879f}.review{fill:#a34f59}.urg{fill:#53866f}.course{fill:#be7d43}.article{fill:#c09a38}.mir{fill:#80669a}
      .title{font-family:Inter,Arial,sans-serif;font-size:48px;font-weight:850;letter-spacing:-1px}.eyebrow{font-family:Inter,Arial,sans-serif;font-size:17px;font-weight:800;letter-spacing:2.6px}
      .h2{font-family:Inter,Arial,sans-serif;font-size:29px;font-weight:850}.h3{font-family:Inter,Arial,sans-serif;font-size:21px;font-weight:850}
      .body{font-family:Inter,Arial,sans-serif;font-size:19px;font-weight:550}.small{font-family:Inter,Arial,sans-serif;font-size:16px;font-weight:650}.tiny{font-family:Inter,Arial,sans-serif;font-size:14px;font-weight:700}
      .line{stroke:#1d1b19;stroke-width:2;opacity:.16}
    </style>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/><feOffset dy="5" result="offset"/><feColorMatrix in="offset" type="matrix" values="0 0 0 0 .15 0 0 0 0 .12 0 0 0 0 .09 0 0 0 .12 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect class="bg" width="1600" height="760" rx="34"/>
  <rect x="0" y="0" width="18" height="760" class="urg"/>
  <text x="72" y="62" class="eyebrow muted">PLAN SEMANAL · BASE MÍNIMA L–V</text>
  <text x="72" y="118" class="title ink">20 POMODOROS · 10 HORAS REALES</text>
  <text x="72" y="156" class="body muted">5 días × 2 horas · 8 h 20 min de estudio activo + descansos 25/5</text>
  <line x1="72" y1="186" x2="1528" y2="186" class="line"/>

  <!-- Segmented 20-Pomodoro ring -->
  <circle cx="450" cy="455" r="275" class="white" filter="url(#shadow)"/>
  <circle cx="450" cy="455" r="220" fill="none" stroke="#e2d9cc" stroke-width="92"/>
  <!-- 9 AP -->
  <circle cx="450" cy="455" r="220" fill="none" stroke="#5b879f" stroke-width="92" stroke-dasharray="61.44 1320.86" transform="rotate(-90 450 455)"/>
  <circle cx="450" cy="455" r="220" fill="none" stroke="#5b879f" stroke-width="92" stroke-dasharray="61.44 1320.86" transform="rotate(-72 450 455)"/>
  <circle cx="450" cy="455" r="220" fill="none" stroke="#5b879f" stroke-width="92" stroke-dasharray="61.44 1320.86" transform="rotate(-54 450 455)"/>
  <circle cx="450" cy="455" r="220" fill="none" stroke="#5b879f" stroke-width="92" stroke-dasharray="61.44 1320.86" transform="rotate(-36 450 455)"/>
  <circle cx="450" cy="455" r="220" fill="none" stroke="#5b879f" stroke-width="92" stroke-dasharray="61.44 1320.86" transform="rotate(-18 450 455)"/>
  <circle cx="450" cy="455" r="220" fill="none" stroke="#5b879f" stroke-width="92" stroke-dasharray="61.44 1320.86" transform="rotate(0 450 455)"/>
  <circle cx="450" cy="455" r="220" fill="none" stroke="#5b879f" stroke-width="92" stroke-dasharray="61.44 1320.86" transform="rotate(18 450 455)"/>
  <circle cx="450" cy="455" r="220" fill="none" stroke="#5b879f" stroke-width="92" stroke-dasharray="61.44 1320.86" transform="rotate(36 450 455)"/>
  <circle cx="450" cy="455" r="220" fill="none" stroke="#5b879f" stroke-width="92" stroke-dasharray="61.44 1320.86" transform="rotate(54 450 455)"/>
  <!-- 5 reviews -->
  <circle cx="450" cy="455" r="220" fill="none" stroke="#a34f59" stroke-width="92" stroke-dasharray="61.44 1320.86" transform="rotate(72 450 455)"/>
  <circle cx="450" cy="455" r="220" fill="none" stroke="#a34f59" stroke-width="92" stroke-dasharray="61.44 1320.86" transform="rotate(90 450 455)"/>
  <circle cx="450" cy="455" r="220" fill="none" stroke="#a34f59" stroke-width="92" stroke-dasharray="61.44 1320.86" transform="rotate(108 450 455)"/>
  <circle cx="450" cy="455" r="220" fill="none" stroke="#a34f59" stroke-width="92" stroke-dasharray="61.44 1320.86" transform="rotate(126 450 455)"/>
  <circle cx="450" cy="455" r="220" fill="none" stroke="#a34f59" stroke-width="92" stroke-dasharray="61.44 1320.86" transform="rotate(144 450 455)"/>
  <!-- protected blocks -->
  <circle cx="450" cy="455" r="220" fill="none" stroke="#53866f" stroke-width="92" stroke-dasharray="61.44 1320.86" transform="rotate(162 450 455)"/>
  <circle cx="450" cy="455" r="220" fill="none" stroke="#53866f" stroke-width="92" stroke-dasharray="61.44 1320.86" transform="rotate(180 450 455)"/>
  <circle cx="450" cy="455" r="220" fill="none" stroke="#be7d43" stroke-width="92" stroke-dasharray="61.44 1320.86" transform="rotate(198 450 455)"/>
  <circle cx="450" cy="455" r="220" fill="none" stroke="#be7d43" stroke-width="92" stroke-dasharray="61.44 1320.86" transform="rotate(216 450 455)"/>
  <circle cx="450" cy="455" r="220" fill="none" stroke="#c09a38" stroke-width="92" stroke-dasharray="61.44 1320.86" transform="rotate(234 450 455)"/>
  <circle cx="450" cy="455" r="220" fill="none" stroke="#80669a" stroke-width="92" stroke-dasharray="61.44 1320.86" transform="rotate(252 450 455)"/>
  <circle cx="450" cy="455" r="153" fill="#f7f1e7"/>
  <text x="450" y="421" text-anchor="middle" class="eyebrow muted">SEMANA BASE</text>
  <text x="450" y="484" text-anchor="middle" class="title ink" font-size="64">20</text>
  <text x="450" y="518" text-anchor="middle" class="h3 ink">Pomodoros</text>
  <text x="450" y="548" text-anchor="middle" class="small muted">sábado opcional / colchón</text>

  <!-- Legend -->
  <rect x="800" y="222" width="728" height="366" rx="26" class="white"/>
  <text x="838" y="265" class="eyebrow muted">REPARTO NORMAL</text>

  <rect x="838" y="297" width="18" height="18" rx="5" class="ap"/>
  <text x="875" y="313" class="h3 ink">Atención Primaria · tema actual</text>
  <text x="1462" y="313" text-anchor="end" class="h3 ap">9 P · 3 h 45</text>
  <rect x="838" y="343" width="18" height="18" rx="5" class="review"/>
  <text x="875" y="359" class="h3 ink">Repasos · Anki + revisión global</text>
  <text x="1462" y="359" text-anchor="end" class="h3 review">5 P · 2 h 05</text>
  <rect x="838" y="389" width="18" height="18" rx="5" class="urg"/>
  <text x="875" y="405" class="h3 ink">Urgencias y emergencias</text>
  <text x="1462" y="405" text-anchor="end" class="h3 urg">2 P · 50 min</text>
  <rect x="838" y="435" width="18" height="18" rx="5" class="course"/>
  <text x="875" y="451" class="h3 ink">Curso</text>
  <text x="1462" y="451" text-anchor="end" class="h3 course">2 P · 50 min</text>
  <rect x="838" y="481" width="18" height="18" rx="5" class="article"/>
  <text x="875" y="497" class="h3 ink">Lectura de artículo</text>
  <text x="1462" y="497" text-anchor="end" class="h3 article">1 P · 25 min</text>
  <rect x="838" y="527" width="18" height="18" rx="5" class="mir"/>
  <text x="875" y="543" class="h3 ink">MIR · preguntas de exámenes</text>
  <text x="1462" y="543" text-anchor="end" class="h3 mir">1 P · 25 min</text>

  <!-- Rules -->
  <rect x="800" y="610" width="728" height="108" rx="23" fill="#eee5d9"/>
  <text x="832" y="648" class="h3 ink">6 Pomodoros protegidos cada semana</text>
  <text x="832" y="680" class="small muted">Urgencias 2 · curso 2 · artículo 1 · preguntas MIR 1.</text>
  <text x="832" y="706" class="small muted">AP + repasos comparten los otros 14: si aumentan los repasos, disminuye AP temporalmente.</text>
</svg>
